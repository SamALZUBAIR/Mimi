name: Build and publish Godot web game

on:
  push:
    branches: [main]
    paths:
      - 'project.godot'
      - 'main.tscn'
      - 'scripts/**'
      - 'assets/**'
      - 'export_presets.cfg'
      - '.github/workflows/deploy-godot-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "/tmp/godot-bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          find /tmp/godot-templates -type f -name '*.template' -exec cp {} "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" \;
          test -n "$(find "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" -type f -name '*.template' -print -quit)"

      - name: Import project resources
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Export Web build
        run: |
          set -euo pipefail
          mkdir -p build
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Web" build/index.html
          test -s build/index.html
          cp -R assets build/assets

      - name: Prepare GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
